id: triton-2017
title: "TRITON"
type: incident
cps_relevance: direct
year: 2017
sectors: [industrial-automation]
target: "Контроллеры противоаварийной защиты Triconex и инженерная станция ПАЗ"
summary: >-
  Нарушитель получил удалённый доступ к инженерной станции системы противоаварийной защиты и
  развернул TRITON, чтобы перепрограммировать контроллеры: по протоколу TriStation в таблицу
  исполнения контроллера Triconex была добавлена программа нарушителя. Часть контроллеров
  перешла в отказобезопасное состояние, что остановило процесс и привело к расследованию. Отчёт
  Mandiant не описывает участия цепочки поставок поставщика.
positions: [operations, device]
facts:
  - text: >-
      Нарушитель получил удалённый доступ к инженерной станции ПАЗ и развернул TRITON для
      перепрограммирования контроллеров ПАЗ.
    sources: [mandiant-triton]
  - text: >-
      TRITON добавил программу нарушителя в таблицу исполнения контроллера Triconex; полезная
      нагрузка — файлы inject.bin (вредоносный код функций) и imain.bin (вредоносная логика).
    sources: [mandiant-triton]
  - text: "TRITON использует закрытый протокол TriStation, который нарушитель, по оценке Mandiant, восстановил самостоятельно."
    sources: [mandiant-triton]
  - text: >-
      Часть контроллеров ПАЗ перешла в отказобезопасное состояние, процесс был автоматически
      остановлен, и владелец объекта начал расследование.
    sources: [mandiant-triton]
  - text: >-
      MITRE ATT&CK v20 приводит группу TEMP.Veles среди примеров T0862: группа нацеливалась на
      нескольких поставщиков и производителей АСУ ТП. В отчёте Mandiant 2017 г. о TRITON участие
      цепочки поставок не описано.
    sources: [mitre-t0862, mandiant-triton]
timeline:
  - {date: "2017-12-14", event: "Публикация отчёта Mandiant", sources: [mandiant-triton]}
attack:
  version: v20
  techniques:
    - {id: T0843, basis: author, note: "загрузка программы в контроллер по TriStation"}
    - {id: T0821, basis: author, note: "добавление программы в таблицу исполнения"}
  objects:
    - {id: G0088, sources: [mitre-t0862], note: "указана MITRE для T0862; в отчёте Mandiant группа не названа"}
scii:
  scope: partial
  scope_note: >-
    Код загружается в контроллер со скомпрометированной инженерной станции; производитель и
    выпуск ПО не затронуты. Атаке соответствует только стадия v5.
  assessed: "2026-11-05"
  evidence:
    - evidence: s51
      state: F
      condition: "Контроллер принимает программы только с подписью ключом, который хранится вне инженерной станции."
      rationale: "Программа нарушителя такой подписи не имеет и не будет принята."
    - evidence: s54
      state: F
      condition: "Состав программ и таблица исполнения контроллера сверяются с утверждённым эталоном по данным самого контроллера."
      rationale: "Добавленная программа и изменённая таблица исполнения дадут расхождение с эталоном."
confidence: high
