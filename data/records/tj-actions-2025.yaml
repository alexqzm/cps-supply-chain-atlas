id: tj-actions-2025
title: "tj-actions/changed-files: переназначение тегов действия GitHub"
aliases: ["CVE-2025-30066", "GHSA-mrrh-fwg8-r2c3"]
type: incident
cps_relevance: general
relevance_note: >-
  Сборка встроенного ПО всё чаще идёт в GitHub Actions и похожих системах. Зависимость сборки,
  закреплённая по изменяемому тегу, даёт нарушителю выполнение кода в сборочной среде и доступ к
  её секретам (оценка автора).
year: 2025
sectors: [software-dev]
target: "Действие GitHub tj-actions/changed-files и использующие его рабочие процессы"
summary: >-
  14–15 марта 2025 г. нарушитель задним числом переназначил несколько тегов версий
  tj-actions/changed-files на вредоносный коммит. Код искал секреты в памяти процесса Runner
  Worker, кодировал их в base64 и выводил в журнал рабочего процесса; в публичных репозиториях
  такие журналы открыты. По оценке GitHub, действие использовали более 23 000 репозиториев.
positions: [upstream, build]
facts:
  - text: >-
      Нарушитель задним числом переназначил несколько тегов версий (в том числе v1.0.0,
      v35.7.7-sec и v44.5.1) на вредоносный коммит 0e58ed8671d6b60d0890c21b07f8835ace038e67.
    sources: [ghsa-tj-actions]
  - text: >-
      Вредоносный код искал секреты в памяти процесса Runner Worker, кодировал их в base64 и
      выводил в журнал рабочего процесса, открывая секреты CI/CD.
    sources: [ghsa-tj-actions]
  - text: >-
      Уязвимость действовала 14–15 марта 2025 г.; затронуты версии до 45.0.7 включительно,
      исправление — 46.0.1; действие использовали более 23 000 репозиториев.
    sources: [ghsa-tj-actions]
timeline:
  - {date: "2025-03-14", event: "Начало действия вредоносных тегов", sources: [ghsa-tj-actions]}
  - {date: "2025-03-15", event: "Публикация GHSA-mrrh-fwg8-r2c3", sources: [ghsa-tj-actions]}
attack:
  version: v20
  techniques:
    - {id: T1195.001, basis: author}
slsa:
  version: "1.2"
  threats:
    - {id: dependency, basis: author, note: "скомпрометированная зависимость сборки"}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s22
      state: F
      condition: >-
        Политика сборки требует закрепления действий по SHA коммита и сверяет зависимости из
        аттестации происхождения со списком разрешённых.
      rationale: "Переназначенный тег разрешается во вредоносный коммит, которого нет в списке разрешённых."
    - evidence: s21
      state: P
      condition: "Сборочный агент подписывает результат своим ключом."
      rationale: "Вредоносный код выполнялся внутри штатного агента; подпись агента от этого не меняется."
confidence: high
notes:
  - "Атака раскрывала секреты, а не подменяла артефакты; похищенные секреты могли использоваться для последующих атак на выпуск."
