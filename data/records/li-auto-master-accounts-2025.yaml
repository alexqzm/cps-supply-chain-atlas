id: li-auto-master-accounts-2025
title: "Перехват мастер-аккаунтов автомобилей Li Auto в России и вымогательство"
aliases: ["Li Auto", "Lixiang"]
type: incident
cps_relevance: direct
year: 2025
sectors: [automotive]
target: "Мастер-аккаунты владельцев автомобилей Li Auto (Lixiang) в России: учётные записи в приложении производителя, привязанные к китайским номерам телефонов"
summary: >-
  С июня 2025 г. владельцы автомобилей Li Auto в России сообщают о перехвате мастер-аккаунта,
  главной учётной записи владельца в приложении производителя, которая служит цифровым ключом:
  логином служит китайский номер телефона, вход подтверждается SMS на этот номер. Нарушитель
  получает контроль над аккаунтом и требует выкуп за возврат доступа. Во второй волне, в конце
  октября 2026 г., аккаунты уводили и у владельцев с оплаченными номерами в eSender; у части
  машин гасли экраны и пропадали функции, некоторые не заводились. Механизм перехвата источники
  не устанавливают, об изменении ПО автомобилей не сообщают.
positions: [operations]
facts:
  - text: >-
      Официальный дилер Li Auto «Авилон Электро» с июня 2025 г. получал жалобы владельцев на
      взлом мастер-аккаунтов и за месяц переоформил 47 аккаунтов, часть из которых пострадала от
      взлома или «угона». Нарушители требовали в среднем 250 тыс. руб., официальное
      восстановление доступа через дилера стоило 17–18 тыс. руб.
    sources: [rg-melyuh-liauto-2025]
  - text: >-
      По словам дилера, мастер-аккаунт даёт через приложение полное управление автомобилем:
      замки, настройку систем, климат-контроль, обновления ПО, мультимедиа и удалённый выезд с
      парковки. Логином служит китайский номер телефона, вход подтверждается SMS на этот номер.
    sources: [rg-melyuh-liauto-2025]
  - text: >-
      Проблемы, по словам дилера, чаще бывают у машин, ввезённых за последние три года серыми
      дилерами и частными поставщиками. Самым безопасным он называл виртуальный номер в eSender,
      привязанный к загранпаспорту владельца (около 2 тыс. руб. в год), но если номер не продлить,
      вместе с ним теряется доступ к мастер-аккаунту.
    sources: [rg-melyuh-liauto-2025]
  - text: >-
      Сооснователь клуба владельцев Lixiang в России и СНГ А. Рассказов в 2025 г. описывал
      перехват так: нарушитель восстанавливает доступ к номеру у провайдера по поддельному
      паспорту, меняет пароль и требует деньги за возврат доступа. Аккаунт теряют и без атаки:
      регистрацию виртуального номера отдают посторонним или забывают его оплатить, а операторы
      виртуальных номеров быстро отключают и перепродают неактивные номера.
    sources: [autonews-liauto-2025]
  - text: >-
      В 2026 г. Autonews.ru сообщил о новой волне перехватов; информацию подтвердил представитель
      Sinomach Auto, официального дистрибьютора Li Auto в России. По данным Рассказова, известно о
      20 пострадавших, а реальное число может быть в несколько раз больше; выкуп снизился с
      200–250 тыс. руб. летом 2025 г. до 35–45 тыс. руб.
    sources: [autonews-liauto-2026]
  - text: >-
      После перехвата у машины гаснут экраны и пропадает большинство функций, включая
      климат-контроль, а некоторые машины не заводятся. У одного владельца после перезагрузки
      появился QR-код для повторной активации, другой смог уехать только с физическим ключом и,
      когда появилась связь, увидел на экране сообщение о необходимости активации.
    sources: [autonews-liauto-2026]
  - text: >-
      По словам Рассказова, теперь аккаунты уводят и у владельцев с исправно оплаченными номерами
      в eSender, причём штатными средствами Li Auto. Как именно, точно неизвестно: рассматриваются
      перебор паролей, кража данных владельцев в Китае и передача логинов и кодов самими
      водителями тем, кто устанавливает приложения, русифицирует и перепрошивает машины.
      Владельцев, по его предположению, находят, пробивая VIN по утёкшим страховым базам.
    sources: [autonews-liauto-2026]
  - text: >-
      Один из пострадавших нашёл в истории eSender несколько SMS с неизвестного номера с запросами
      на смену номера и привязки мастер-аккаунта; у другого сначала отключился семейный аккаунт, а
      после восстановления входа из учётной записи пропала машина.
    sources: [autonews-liauto-2026]
  - text: >-
      Дистрибьютор сообщил, что вместе с Li Auto разрабатывает проверку законных владельцев и
      перевод учётных записей с китайских номеров на адреса электронной почты; такая авторизация
      уже есть у машин 2026 модельного года. Решения обещаны и для машин из параллельного импорта,
      сроки не названы.
    sources: [autonews-liauto-2026]
