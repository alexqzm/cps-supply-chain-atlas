scii:
  scope: out
  scope_note: >-
    Нарушитель получает учётную запись владельца в сервисе производителя и действует штатными
    средствами Li Auto; об изменении ПО автомобиля источники не сообщают. Гейт допуска обновлений и
    проверки на устройстве этих действий не видят. Канал управления в эксплуатации и привязку
    владельца нужно защищать отдельно.
  assessed: "2026-11-05"
  evidence:
    - evidence: s51
      state: P
      condition: "Автомобиль проверяет подпись образов ПО перед установкой и при загрузке."
      rationale: >-
        Перехват мастер-аккаунта не устанавливает и не меняет ПО: автомобиль переходит под чужую
        учётную запись, и проверка подписи образов этому не мешает.
confidence: medium
confidence_note: >-
  Только новости: интервью официального дилера (2025) и рассказы клуба владельцев и пострадавших
  (2025–2026), во второй волне с подтверждением дистрибьютора. Технического разбора нет, механизм
  перехвата не установлен.
notes:
  - >-
    Пограничная запись, как KA-SAT: включена по первому критерию как атака на канал удалённого
    управления автомобилем, через который, по словам дилера, идут и обновления ПО. Установку,
    задержку или откат обновлений через перехваченный аккаунт источники не описывают.
  - >-
    Версия о передаче логинов и кодов тем, кто русифицирует и перепрошивает машины, касается
    утечки учётных данных; сторонние перепрошивки как изменение ПО в записи не оцениваются.
  - >-
    Пересказы в других изданиях смешивают версии двух волн (поддельный паспорт и перепродажа
    неактивных номеров — 2025 г., оплаченные номера — 2026 г.); в запись внесены только сведения
    первоисточников.
  - "Сопоставление с ATT&CK не приводится: матрицы ATT&CK для автомобилей нет."
