scii:
  scope: out
  scope_note: >-
    Код внесён самим сопровождающим, поэтому свидетельства происхождения подтверждаются. Против
    выборочной активации помогают только независимый анализ и тестирование в условиях
    срабатывания, которых в графе SCII нет.
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: P
      condition: "Проверяется подпись или аттестация публикации."
      rationale: "Версии опубликовал сам сопровождающий."
    - evidence: s43
      state: P
      condition: "Тестирование проводится на узлах вне России и Беларуси."
      rationale: "Разрушающий код срабатывал только по геолокации IP-адреса, поэтому такие тесты его не выявят (оценка автора)."
