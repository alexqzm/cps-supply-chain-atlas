id: node-ipc-2022
title: "node-ipc: разрушающий код, срабатывающий по геолокации IP-адреса"
aliases: ["CVE-2022-23812", "peacenotwar"]
type: incident
cps_relevance: general
relevance_note: >-
  Вредоносный код внёс сам сопровождающий, и срабатывал он только на узлах с российскими и
  белорусскими IP-адресами. Для КФС с открытыми компонентами это пример угрозы со стороны
  производителя с выборочной активацией (оценка автора).
year: 2022
sectors: [software-dev]
target: "Пакет npm node-ipc и зависимые проекты"
summary: >-
  Версии node-ipc 10.1.1 и 10.1.2 (7–8 марта 2022 г.) проверяли, есть ли у узла российский или
  белорусский IP-адрес, и в этом случае перезаписывали файлы символом сердца. Уязвимости
  присвоен CVE-2022-23812; версия 10.1.3 убрала разрушающий код, а 10.1.1 и 10.1.2 удалены из
  npm. Версии 11 и 9.2.2 добавляли пакет peacenotwar, создающий файл на рабочем столе; через
  node-ipc 9.2.2 затронуты Vue.js и Unity Hub 3.1.
positions: [producer]
facts:
  - text: >-
      Разработчик node-ipc намеренно добавил разрушающий код: версии 10.1.1 и 10.1.2, выпущенные
      7–8 марта 2022 г., при российском или белорусском IP-адресе узла перезаписывали файлы
      символом сердца.
    sources: [register-node-ipc]
  - text: >-
      GitHub зарегистрировал критическую уязвимость CVE-2022-23812; версия 10.1.3 убрала
      разрушающий код, версии 10.1.1 и 10.1.2 удалены из npm.
    sources: [register-node-ipc]
  - text: >-
      Версии 11 и 9.2.2 добавляли пакет peacenotwar, создающий файл WITH-LOVE-FROM-AMERICA.txt на
      рабочем столе и в OneDrive; node-ipc 9.2.2 попал в Vue.js и в Unity Hub 3.1.
    sources: [register-node-ipc]
timeline:
  - {date: "2022-03-07", event: "Выпуск версий 10.1.1 и 10.1.2 (7–8 марта)", sources: [register-node-ipc]}
attack:
  version: v20
  techniques:
    - {id: T1195.001, basis: author}
slsa:
  version: "1.2"
  threats:
