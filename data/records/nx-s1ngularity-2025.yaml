id: nx-s1ngularity-2025
title: "Nx (s1ngularity): вредоносные версии, опубликованные с похищенным токеном npm"
aliases: ["s1ngularity"]
type: incident
cps_relevance: general
relevance_note: >-
  Вредоносные версии опубликованы в обход конвейера, и только отсутствие аттестации
  происхождения отличало их от подлинных. Это довод за обязательную проверку происхождения при
  допуске, в том числе обновлений КФС (оценка автора).
year: 2025
sectors: [software-dev]
target: "Пакеты nx и @nx/* в npm; рабочие процессы GitHub Actions репозитория Nx"
summary: >-
  26.08.2025 нарушитель опубликовал в npm вредоносные версии пакетов Nx, используя токен
  публикации, похищенный через внедрение команд в рабочем процессе pull_request_target, который
  выводил заголовок запроса на слияние без очистки. Скрипт postinstall искал конфиденциальные
  данные, пытался использовать локальные ИИ-инструменты и выкладывал результаты в публичные
  репозитории GitHub. У вредоносных версий не было аттестации происхождения npm, но это не
  мешало их установке.
positions: [build, repository]
facts:
  - text: "26.08.2025 нарушитель опубликовал в npm вредоносные версии нескольких пакетов Nx; они были доступны около 4 часов."
    sources: [nx-postmortem]
  - text: >-
      Токен публикации npm похищен через внедрение команд: рабочий процесс pull_request_target
      выводил заголовок запроса на слияние без очистки, у рабочих процессов были права на запись,
      а процесс публикации допускал ручной запуск.
    sources: [nx-postmortem]
  - text: >-
      Скрипт postinstall искал конфиденциальные данные, пытался использовать локальные
      ИИ-инструменты (Claude, Gemini) и выкладывал результаты в публичный репозиторий GitHub.
    sources: [nx-postmortem]
  - text: >-
      У вредоносных версий не было аттестации происхождения npm; по её отсутствию Nx установила,
      что версии опубликованы не из её CI. Аттестация не мешает установке пакетов без неё.
    sources: [nx-postmortem]
timeline:
  - {date: "2025-08-26", event: "Публикация вредоносных версий", sources: [nx-postmortem]}
  - {date: "2025-09-05", event: "Разбор инцидента Nx", sources: [nx-postmortem]}
attack:
