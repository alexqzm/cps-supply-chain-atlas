id: badbox2-2025
title: "BADBOX 2.0: вредоносное ПО в устройствах до покупки"
aliases: ["BADBOX 2.0", "I-060525-PSA"]
type: incident
cps_relevance: direct
year: 2025
sectors: [consumer-iot, automotive]
target: "ТВ-приставки, проекторы, мультимедийные системы автомобилей вторичного рынка, цифровые фоторамки"
summary: >-
  ФБР предупредило о ботнете BADBOX 2.0, в котором миллионы заражённых устройств. Устройство
  либо настраивается с вредоносным ПО ещё до покупки, либо заражается при первичной настройке,
  когда загружает необходимые приложения с бэкдорами. Среди устройств названы мультимедийные
  системы автомобилей вторичного рынка; большинство заражённых устройств произведено в Китае.
positions: [manufacturing]
facts:
  - text: >-
      В перечне устройств — ТВ-приставки, цифровые проекторы, мультимедийные системы автомобилей
      вторичного рынка, цифровые фоторамки и другие изделия.
    sources: [fbi-badbox2]
  - text: >-
      Пути заражения: устройство настраивают с вредоносным ПО до покупки, либо оно заражается при
      загрузке необходимых приложений с бэкдорами, обычно во время первичной настройки.
    sources: [fbi-badbox2]
  - text: >-
      Ботнет BADBOX 2.0 появился после пресечения исходной кампании BADBOX в 2024 г. и включает
      миллионы устройств; бэкдоры используются для служб резидентных прокси.
    sources: [fbi-badbox2]
  - text: "Большинство заражённых устройств, по данным ФБР, произведено в Китае."
    sources: [fbi-badbox2]
timeline:
  - {date: "2025-06-05", event: "Публикация предупреждения ФБР", sources: [fbi-badbox2]}
attack:
  version: v20
  techniques:
    - {id: T1195, basis: author, note: "заражение до поставки потребителю"}
slsa:
  version: "1.2"
  threats:
    - {id: A, basis: author, note: "предустановка на стороне изготовителя или его поставщиков"}
scii:
  scope: out
  scope_note: >-
    Заражённый образ поступает с производства. Если эталон для проверки получен от того же
    изготовителя, проверки на устройстве подтверждают заражённый образ.
  assessed: "2026-11-05"
  evidence:
    - evidence: s51
      state: P
      condition: "Заражённый образ подписан изготовителем, и загрузчик проверяет эту подпись."
      rationale: "Проверка подписи подтверждает образ, выпущенный самим изготовителем, вместе с вредоносным ПО."
    - evidence: s54
      state: P
      condition: "Эталон измерения для аттестации предоставляет тот же изготовитель."
      rationale: "Измерение совпадёт с заражённым эталоном."
confidence: high
