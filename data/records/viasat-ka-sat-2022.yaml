id: viasat-ka-sat-2022
title: "Атака на сеть KA-SAT и потеря удалённого мониторинга ветроустановок Enercon"
aliases: ["KA-SAT", "Viasat"]
type: incident
cps_relevance: direct
year: 2022
sectors: [telecom-satellite, energy]
target: "Абонентские спутниковые модемы сети KA-SAT; канал удалённого мониторинга ветроустановок Enercon"
summary: >-
  24.02.2022 нарушитель через ошибку конфигурации VPN-устройства проник в доверенный сегмент
  управления сети KA-SAT и отправил множеству модемов легитимные адресные команды управления,
  которые перезаписали ключевые данные во флеш-памяти. Десятки тысяч модемов выпали из сети.
  Около 5 800 ветроустановок Enercon суммарной мощностью 11 ГВт потеряли удалённый мониторинг и
  управление, продолжая работать в автоматическом режиме. Viasat не нашла признаков
  вмешательства в цепочку поставок модемов.
positions: [operations, device]
facts:
  - text: >-
      24.02.2022 нарушитель, используя ошибку конфигурации VPN-устройства, получил доступ к
      доверенному сегменту управления сети KA-SAT.
    sources: [viasat-kasat]
  - text: >-
      Нарушитель отправил множеству абонентских модемов легитимные адресные команды управления,
      которые перезаписали ключевые данные во флеш-памяти модемов; десятки тысяч модемов выпали
      из сети.
    sources: [viasat-kasat]
  - text: >-
      Viasat не нашла признаков вмешательства в цепочку поставок, а также компрометации или
      подмены образов ПО и встроенного ПО модемов.
    sources: [viasat-kasat]
  - text: "Viasat отправила дистрибьюторам почти 30 000 модемов, чтобы вернуть абонентов в сеть."
    sources: [viasat-kasat]
  - text: >-
      У Enercon около 5 800 ветроустановок суммарной мощностью 11 ГВт в Центральной Европе
      потеряли удалённый мониторинг и управление; установки продолжали работать в
      автоматическом режиме.
    sources: [reuters-enercon]
  - text: >-
      Enercon связывает отказ с атакой на соединение ветроустановок со спутниковой сетью Ka-Sat;
      повреждённые спутниковые модемы заменяются, поставка оборудования затруднена.
    sources: [energate-enercon]
timeline:
  - {date: "2022-02-24", event: "Атака на сеть KA-SAT", sources: [viasat-kasat]}
  - {date: "2022-03-30", event: "Публикация обзора Viasat", sources: [viasat-kasat]}
attack:
  version: v20
  techniques:
    - {id: T0822, basis: author, note: "вход через VPN-устройство с ошибкой конфигурации"}
    - {id: T0809, basis: author, note: "перезапись данных во флеш-памяти модемов"}
    - {id: T0829, basis: author, note: "потеря удалённого мониторинга ветроустановок"}
scii:
  scope: out
  scope_note: >-
    Нарушитель воспользовался каналом управления оператора и легитимными командами управления, а
    не обновлением ПО. Гейт допуска обновлений такие команды не видит, а проверка подписи при
    загрузке не мешает стереть данные во флеш-памяти. Канал управления устройством нужно
    контролировать отдельно.
  assessed: "2026-11-05"
  evidence:
    - evidence: s51
      state: P
      condition: "Модем проверяет подпись образа при загрузке."
      rationale: >-
        Команды управления не загружают новый образ, а разрушают данные; после этого устройство
        не работает независимо от проверки подписи.
confidence: high
notes:
  - "Связь отказа у Enercon с KA-SAT — по заявлению Enercon в изложении energate; Viasat в обзоре Enercon не упоминает."
  - "В первые дни (Reuters, 28.02.2022) Enercon сообщала, что точная причина отказа ещё не известна."
