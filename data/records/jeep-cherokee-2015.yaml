id: jeep-cherokee-2015
title: "Удалённая атака на Jeep Cherokee через Uconnect и перепрошивку V850"
type: demonstration
cps_relevance: direct
year: 2015
sectors: [automotive]
target: "Головное устройство Harman Uconnect 8.4AN/RA4 и микроконтроллер Renesas V850 в Jeep Cherokee 2014"
summary: >-
  Miller и Valasek получили удалённое выполнение команд с правами root на головном устройстве
  через службу D-Bus на порту 6667, доступную в том числе через сотовую сеть Sprint, и
  перепрошили микроконтроллер V850 изменённым встроенным ПО через штатную утилиту обновления
  iocupdate, после чего смогли отправлять сообщения в шину CAN. Встроенное ПО V850 не
  проверялось криптографической подписью. Отзывная кампания по итогам исследования затронула
  1,4 млн автомобилей.
positions: [operations, device]
facts:
  - text: >-
      Головное устройство открывает службу D-Bus на TCP-порту 6667 с анонимной аутентификацией;
      порт доступен через встроенную точку Wi-Fi и через сотовую сеть Sprint.
    sources: [ioactive-jeep]
    locator: "с. 29"
  - text: "Служба NavTrailService имеет метод execute, выполняющий произвольные команды оболочки с правами root."
    sources: [ioactive-jeep]
    locator: "с. 39"
  - text: >-
      Микроконтроллер V850, через который головное устройство работает с шиной CAN,
      перепрошивается утилитой iocupdate изменённым встроенным ПО, принимающим команды для шины
      CAN.
    sources: [ioactive-jeep]
  - text: "Для проверки подлинности встроенного ПО V850 криптографические подписи не используются."
    sources: [ioactive-jeep]
    locator: "с. 50"
  - text: "Отзывная кампания по итогам исследования затронула 1,4 млн автомобилей."
    sources: [ioactive-jeep]
    locator: "с. 47"
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s51
      state: F
      condition: "V850 принимает только образ с подписью производителя, ключа которой нет на головном устройстве."
      rationale: "Изменённое встроенное ПО не имеет подписи производителя и не было бы принято."
    - evidence: s53
      state: N
      condition: "Микроконтроллер принимает обновление только с квитанцией допуска, выданной для этого автомобиля."
      rationale: "У нарушителя нет квитанции допуска на изменённый образ."
confidence: high
notes:
  - "Сопоставление с ATT&CK не приводится: матрицы ATT&CK для автомобилей нет."
