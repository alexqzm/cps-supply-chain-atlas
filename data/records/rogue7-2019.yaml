id: rogue7-2019
title: "Rogue7: подложная инженерная станция для ПЛК S7-1500"
type: demonstration
cps_relevance: direct
year: 2019
sectors: [industrial-automation]
target: "ПЛК Siemens SIMATIC S7-1500, протокол S7 версии P3, TIA Portal"
summary: >-
  Исследователи Техниона и Тель-Авивского университета показали, что ПЛК S7-1500 принимает
  загрузку от любого клиента, прошедшего рукопожатие: аутентифицируется только ПЛК, а его
  открытый ключ общий для всех ПЛК одной модели и версии. При скрытой загрузке программы ПЛК
  исполняет объектный код одной программы, а инженер в TIA Portal видит исходный код другой;
  проверка целостности по HMAC проходит, потому что нарушитель вычисляет её сам.
positions: [device, tooling]
facts:
  - text: >-
      Рукопожатие протокола P3 аутентифицирует только ПЛК; открытый ключ ПЛК общий для всех ПЛК
      одной модели и версии и хранится в файлах TIA Portal.
    sources: [bh-rogue7]
  - text: "TIA Portal не аутентифицируется: ПЛК принимает загрузку от любого клиента, прошедшего рукопожатие."
    sources: [bh-rogue7]
  - text: "Загрузка программы защищена HMAC, но нарушитель вычисляет верные значения с сеансовым ключом."
    sources: [bh-rogue7]
  - text: >-
      При скрытой загрузке ПЛК получает и исполняет объектный код одной программы, а инженер в TIA
      Portal видит исходный код другой; проверка целостности проходит.
    sources: [bh-rogue7]
attack:
  version: v20
  techniques:
    - {id: T0843, basis: author}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
