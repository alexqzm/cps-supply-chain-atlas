id: plc-blaster-2016
title: "PLC-Blaster: червь, живущий только в ПЛК"
type: demonstration
cps_relevance: direct
year: 2016
sectors: [industrial-automation]
target: "ПЛК Siemens SIMATIC S7-1200 (v3)"
summary: >-
  Червь, написанный как программа ПЛК, ищет в сети узлы с открытым портом 102/tcp, останавливает
  программу целевого ПЛК, передаёт ему свою копию дополнительным блоком (OB9999) по инженерному
  протоколу TIA Portal и перезапускает ПЛК; основная программа не меняется. Защита ноу-хау и
  защита от копирования червя не останавливают, защита доступа с паролем, по оценке авторов,
  может остановить, но по умолчанию выключена. Авторы предупреждают, что заражённые ПЛК могут
  прийти от поставщика или при транспортировке.
positions: [device]
facts:
  - text: >-
      Червь ищет узлы с открытым портом 102/tcp, останавливает программу целевого ПЛК, передаёт
      свою копию по протоколу, которым пользуется TIA Portal, и перезапускает ПЛК; копия хранится
      дополнительным блоком OB9999, основная программа не меняется.
    sources: [bh-plc-blaster]
  - text: >-
      Защита ноу-хау и защита от копирования червя не останавливают: защита ноу-хау обеспечивается
      в TIA Portal, а не в ПЛК, а серийный номер для защиты от копирования не защищён от
      изменения.
    sources: [bh-plc-blaster]
  - text: >-
      Защита доступа с запретом записи, по оценке авторов, может защитить ПЛК от червя, но по
      умолчанию выключена; заражение ПЛК с паролем авторы не проверяли.
    sources: [bh-plc-blaster]
  - text: >-
      TIA Portal показывает добавленные блоки, но не анализирует их; авторы предупреждают, что
      заражённые устройства могут прийти от поставщика или при транспортировке.
    sources: [bh-plc-blaster]
attack:
  version: v20
  techniques:
    - {id: T0843.003, basis: author, note: "копия червя добавляется отдельным блоком"}
