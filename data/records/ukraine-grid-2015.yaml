id: ukraine-grid-2015
title: "Атака на распределительные электросети Украины (2015)"
aliases: ["C0028", "2015 Ukraine Electric Power Attack"]
type: incident
cps_relevance: direct
year: 2015
sectors: [energy]
target: "Преобразователи последовательных интерфейсов в Ethernet на подстанциях; SCADA и HMI операторов"
summary: >-
  Sandworm Team проникла в сети операторов, по VPN с действительными учётными записями вышла в
  среду управления, разомкнула выключатели через HMI и перезаписала встроенное ПО
  преобразователей последовательных интерфейсов в Ethernet собственной прошивкой. Преобразователи
  стали невосстановимы, связь с нижестоящими устройствами прервалась. Для атласа важен этот шаг:
  постороннее встроенное ПО загружено в устройства в обход любой цепочки выпуска.
positions: [operations, device]
facts:
  - text: "Кампания C0028 приписана Sandworm Team; первые действия — декабрь 2015 г., последние — январь 2016 г."
    sources: [mitre-c0028]
  - text: >-
      Встроенное ПО преобразователей последовательных интерфейсов в Ethernet перезаписано
      собственной прошивкой нарушителя; преобразователи стали невосстановимы, связь с нижестоящими
      устройствами прервалась.
    sources: [mitre-c0028]
  - text: "Для доступа к VPN системы управления использовались действительные учётные записи, полученные из домена."
    sources: [mitre-c0028]
  - text: "Выключатели разомкнуты командами через HMI; энергоснабжение было прервано примерно на 6 часов."
    sources: [mitre-c0028]
  - text: "ИБП были запланированы на отключение серверов передачи данных и телефонии."
    sources: [mitre-c0028]
