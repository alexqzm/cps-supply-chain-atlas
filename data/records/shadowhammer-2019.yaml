id: shadowhammer-2019
title: "ShadowHammer: троянизированная утилита ASUS Live Update"
aliases: ["Operation ShadowHammer"]
type: incident
cps_relevance: general
relevance_note: >-
  Вредоносное обновление было подписано действительными сертификатами производителя,
  распространялось с его серверов обновлений и предназначалось только для устройств из списка
  MAC-адресов. Для КФС это сценарий адресной атаки через штатный канал обновления (оценка
  автора).
year: 2019
sectors: [it-general]
target: "Утилита ASUS Live Update и серверы обновлений ASUS"
summary: >-
  С июня по ноябрь 2018 г. троянизированная утилита ASUS Live Update, подписанная действительными
  сертификатами ASUS, распространялась с официальных серверов обновлений ASUS. Вредоносный код
  сверял MAC-адреса сетевых адаптеров со встроенным списком, чтобы точечно выбрать цели; из более
  чем 200 образцов извлечено свыше 600 адресов. Бэкдор установили более 57 000 пользователей
  Kaspersky.
positions: [distribution]
facts:
  - text: "Атака продолжалась с июня по ноябрь 2018 г.; Kaspersky обнаружила её в январе 2019 г."
    sources: [securelist-shadowhammer]
  - text: >-
      Вредоносные версии утилиты были подписаны действительными сертификатами ASUS и размещались
      на официальных серверах обновлений liveupdate01s.asus[.]com и liveupdate01.asus[.]com.
    sources: [securelist-shadowhammer]
  - text: >-
      Код сверял MAC-адреса сетевых адаптеров с жёстко заданным списком; из более чем 200
      образцов извлечено свыше 600 уникальных адресов.
    sources: [securelist-shadowhammer]
  - text: >-
      Бэкдор установили более 57 000 пользователей Kaspersky; по оценке компании, затронуто,
      возможно, более миллиона пользователей.
    sources: [securelist-shadowhammer]
timeline:
  - {date: "2019-03-25", event: "Публикация Kaspersky", sources: [securelist-shadowhammer]}
attack:
  version: v20
  techniques:
    - {id: T1195.002, basis: author}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: P
      condition: "Проверяется подпись производителя."
      rationale: "Вредоносные версии подписаны действительными сертификатами ASUS."
    - evidence: s43
      state: P
      condition: "Пакет тестируется на устройствах, MAC-адресов которых нет в списке целей."
      rationale: >-
        Адресная активация по списку MAC-адресов делает обнаружение функциональными тестами
        маловероятным, если тестовые устройства не входят в список (оценка автора).
    - evidence: s22
      state: F
      condition: "Пакет изменён после сборки, а допуск сверяет его хэш с аттестацией происхождения."
      rationale: "Хэш изменённого пакета не совпадёт с хэшем в аттестации."
confidence: high
notes:
  - "Точка внесения вредоносного кода (сборка, подпись или хранилище) в источнике не установлена, поэтому угроза SLSA не указана."
