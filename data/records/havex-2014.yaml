id: havex-2014
title: "Havex: троянизированные установщики поставщиков АСУ ТП"
aliases: ["Backdoor.Oldrea", "Dragonfly"]
type: incident
cps_relevance: direct
year: 2014
sectors: [industrial-automation]
target: "ПО поставщиков оборудования и ПО для АСУ ТП, распространяемое через их сайты"
summary: >-
  Нарушители взломали сайты не менее трёх поставщиков АСУ ТП и разместили на них
  троянизированные установщики обновлений с вредоносной программой Havex. Её модуль искал в
  сети серверы OPC на основе DCOM (OPC Classic); устройства с OPC UA, по данным CISA, целью не
  были. MITRE приводит этот случай как пример техники компрометации цепочки поставок.
positions: [distribution]
facts:
  - text: "Троянизированные установщики обновлений размещались на сайтах не менее трёх поставщиков АСУ ТП."
    sources: [cisa-icsa-14-178-01]
  - text: >-
      Модуль сканирования Havex работает с классическим OPC на основе DCOM; известные компоненты,
      по CISA, не нацелены на устройства с OPC UA.
    sources: [cisa-icsa-14-178-01]
  - text: >-
      Поставщики находятся в Бельгии, Швейцарии и Германии: два производителя ПО удалённого
      управления и производитель промышленных камер; названия не приводятся.
    sources: [securityweek-havex]
  - text: >-
      MITRE ATT&CK приводит Backdoor.Oldrea (Havex) и группу Dragonfly как примеры T0862:
      троянизированные пакеты ПО поставщиков оборудования АСУ ТП предлагались для загрузки на их
      сайтах.
    sources: [mitre-t0862]
  - text: >-
      В T1195.002 MITRE описывает Dragonfly: троянизированные установщики ПО систем управления
      размещались на легитимных ресурсах поставщиков для загрузки приложений.
    sources: [mitre-t1195-002]
timeline:
  - {date: "2014-06-24", event: "Публикация SecurityWeek о Havex и троянизированных установщиках", sources: [securityweek-havex]}
attack:
  version: v20
  techniques:
    - {id: T0862, basis: mitre, sources: [mitre-t0862]}
    - {id: T1195.002, basis: mitre, sources: [mitre-t1195-002]}
  objects:
    - {id: S0093, sources: [mitre-t0862]}
    - {id: G0035, sources: [mitre-t0862, mitre-t1195-002]}
slsa:
  version: "1.2"
  threats:
    - {id: G, basis: author, note: "канал распространения — сайт поставщика"}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: F
      condition: >-
        Поставщик подписывает установщик ключом, к которому у нарушителя нет доступа, а получатель
        проверяет подпись по закреплённому ключу до установки.
      rationale: >-
        Изменённый установщик не пройдёт проверку подписи; если нарушитель выложит его без
        подписи, свидетельство будет N. Были ли подписаны подлинные установщики, источники не
        сообщают.
    - evidence: s22
      state: N
      condition: "Допуск требует аттестацию происхождения, связывающую хэш пакета со сборкой поставщика."
      rationale: "Нарушитель с доступом только к сайту не может предъявить аттестацию для троянизированного установщика."
confidence: high
