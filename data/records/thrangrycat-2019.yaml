id: thrangrycat-2019
title: "Thrangrycat: вмешательство в Secure Boot через ПЛИС оборудования Cisco"
aliases: ["CVE-2019-1649", "cisco-sa-20190513-secureboot"]
type: demonstration
cps_relevance: general
relevance_note: >-
  Проверка подписи при загрузке и аппаратная аттестация опираются на аппаратный корень доверия.
  Пример показывает, что при изменении корня доверия обе проверки перестают защищать (оценка
  автора).
year: 2019
sectors: [network-equipment]
target: "Аппаратная реализация Secure Boot (ПЛИС) в оборудовании Cisco"
summary: >-
  Cisco: из-за неправильной проверки в коде, управляющем обновлением ПЛИС аппаратной реализации
  Secure Boot, нарушитель с повышенными привилегиями в ОС может записать в ПЛИС изменённую
  прошивку и вмешаться в проверку Secure Boot, чтобы установить и загрузить вредоносный образ.
  По данным Red Balloon Security, сообщившей об уязвимости, в сочетании с уязвимостью
  веб-интерфейса CVE-2019-1862 возможна удалённая устойчивая компрометация.
positions: [device]
facts:
  - text: >-
      Уязвимость вызвана неправильной проверкой в коде, управляющем обновлением ПЛИС в аппаратной
      реализации Secure Boot; эксплуатация требует повышенных привилегий и доступа к ОС.
    sources: [cisco-sa-secureboot]
  - text: >-
      Записав в ПЛИС изменённую прошивку, нарушитель может вывести устройство из строя или
      вмешаться в проверку Secure Boot и загрузить вредоносный образ; обходных мер нет.
    sources: [cisco-sa-secureboot]
  - text: >-
      По данным Red Balloon Security, битовый поток ПЛИС хранится в флеш-памяти без защиты;
      изменение сохраняется между загрузками и может блокировать последующие обновления; в
      сочетании с CVE-2019-1862 возможна удалённая устойчивая компрометация.
    sources: [securityaffairs-thrangrycat]
timeline:
  - {date: "2019-05-13", event: "Публикация уведомления Cisco", sources: [cisco-sa-secureboot]}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s51
      state: P
      condition: "Подпись образа проверяет изменённая реализация Secure Boot."
      rationale: "Изменённая ПЛИС пропускает вредоносный образ."
    - evidence: s54
      state: P
      condition: "Аттестация опирается на тот же аппаратный корень доверия."
      rationale: "Измерения, которые выдаёт изменённый корень доверия, недостоверны (оценка автора)."
confidence: high
