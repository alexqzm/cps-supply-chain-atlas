id: contec-cms8000-2025
title: "Contec CMS8000: скрытые функции во встроенном ПО монитора пациента"
aliases: ["ICSMA-25-030-01", "CVE-2025-0626", "CVE-2025-0683", "CVE-2025-1204"]
type: incident
cps_relevance: direct
year: 2025
sectors: [medical]
target: "Монитор пациента Contec CMS8000 (в том числе продаваемый под другими марками)"
summary: >-
  CISA сообщила о скрытых функциях во встроенном ПО монитора пациента Contec CMS8000: двоичный
  модуль пытается смонтировать ресурс по жёстко заданному маршрутизируемому IP-адресу в обход
  сетевых настроек устройства, что может служить бэкдором, а в конфигурации по умолчанию
  устройство передаёт данные пациентов в открытом виде на жёстко заданный публичный адрес.
  Функции содержатся в ПО, выпущенном производителем.
positions: [producer]
facts:
  - text: >-
      CVE-2025-0626 (скрытая функциональность): модуль пытается смонтировать ресурс по жёстко
      заданному маршрутизируемому IP-адресу в обход сетевых настроек устройства; по оценке CISA,
      это может служить бэкдором.
    sources: [cisa-icsma-25-030-01]
  - text: >-
      CVE-2025-0683 (утечка персональных данных): в конфигурации по умолчанию устройство
      передаёт данные пациентов в открытом виде на жёстко заданный публичный IP-адрес.
    sources: [cisa-icsma-25-030-01]
  - text: >-
      CVE-2025-1204 (скрытая функциональность): модуль обновления срабатывает при нажатии кнопки
      «C» в определённый момент загрузки и также пытается смонтировать ресурс по жёстко заданному
      маршрутизируемому адресу.
    sources: [cisa-icsma-25-030-01]
  - text: >-
      Затронуты версии встроенного ПО smart3250-2.6.27-wlan2.1.7.cramfs, CMS7.820.075.08/0.74(0.75)
      и CMS7.820.120.01/0.93(0.95); устройство может продаваться перепродавцами под другими
      марками.
    sources: [cisa-icsma-25-030-01]
timeline:
  - {date: "2025-01-30", event: "Публикация уведомления CISA", sources: [cisa-icsma-25-030-01]}
  - {date: "2025-02-25", event: "Обновление A уведомления CISA", sources: [cisa-icsma-25-030-01]}
attack:
  version: v20
  techniques:
    - {id: T0862, basis: author, note: "опасная функция поступает к потребителю вместе с изделием"}
slsa:
  version: "1.2"
  threats:
    - {id: A, basis: author, note: "функция содержится в ПО производителя"}
scii:
  scope: out
  scope_note: >-
    Функции содержатся в ПО, выпущенном самим производителем. Граф SCII подтверждает, что пакет
    выпущен владельцем ключей по проверенной цепочке, но не оценивает намерения производителя.
    Обнаружить такие функции может только независимый анализ ПО, которого в графе SCII нет.
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: P
      condition: "Пакет обновления подписан производителем."
      rationale: "Подпись производителя подтверждается: функции внесены на его стороне."
    - evidence: s24
      state: P
      condition: "Независимая пересборка выполняется из исходного кода, предоставленного производителем."
      rationale: "Если функции есть в исходном коде, пересборка их воспроизведёт и совпадёт с выпуском."
confidence: high
