id: xz-utils-2024
title: "Бэкдор в выпускных архивах xz-utils 5.6.0 и 5.6.1"
aliases: ["xz", "liblzma"]
type: incident
cps_relevance: general
relevance_note: >-
  Библиотека liblzma входит в образы встраиваемого Linux, а системы их сборки берут исходники из
  выпускных архивов. По обзору source-match (05.11.2026) в архиве xz 5.8.4 файл
  m4/build-to-host.m4 по-прежнему не прослеживается до подписанного тега (применимость к КФС —
  оценка автора).
year: 2024
sectors: [it-general]
target: "Выпускные архивы xz-utils 5.6.0 и 5.6.1"
summary: >-
  Выпускные архивы xz-utils 5.6.0 и 5.6.1 содержали бэкдор; архивы создал и подписал
  сопровождающий Jia Tan. Часть бэкдора была только в выпускных архивах: файл
  m4/build-to-host.m4 в git для сборки xz не используется. Подпись архива подтверждала автора
  выпуска, но не соответствие архива подписанному исходному коду.
positions: [producer, source]
facts:
  - text: "Выпускные архивы xz-utils 5.6.0 и 5.6.1 содержат бэкдор; эти архивы создал и подписал Jia Tan."
    sources: [collin-xz]
  - text: "Одна часть бэкдора находится только в распространяемых выпускных архивах."
    sources: [freund-xz]
  - text: "build-to-host в git для сборки xz не используется."
    sources: [freund-xz]
  - text: >-
      Файлы с основной частью эксплойта в обфусцированном виде находятся в
      tests/files/bad-3-corrupt_lzma2.xz и tests/files/good-large_compressed.lzma, внесённых в
      основной репозиторий.
    sources: [freund-xz]
  - text: >-
      В выпускном архиве xz 5.8.4 до подписанного тега не прослеживаются 148 файлов (43,9 %
      объёма); среди добавленных в архив файлов — m4/build-to-host.m4.
    sources: [source-match-survey]
timeline:
  - {date: "2024-03-29", event: "Сообщение Andres Freund в рассылке oss-security", sources: [freund-xz]}
attack:
  version: v20
  techniques:
    - {id: T1195.001, basis: author}
slsa:
  version: "1.2"
  threats:
    - {id: A, basis: author, note: "бэкдор внесён сопровождающим с правом выпуска"}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: P
      condition: "Проверяется подпись выпускного архива ключом сопровождающего."
      rationale: "Архивы подписал тот же сопровождающий, который внёс бэкдор."
    - evidence: s14
      state: F
      condition: >-
        Свидетельство s14 распространено на выпускной архив: архив сверяется с деревом
        подписанного тега (как в source-match).
      rationale: "Изменённый m4/build-to-host.m4 есть только в архиве, и сверка с тегом даёт расхождение."
    - evidence: s24
      state: F
      condition: "Независимая пересборка выполняется из подписанного тега, а не из выпускного архива."
      rationale: "Части бэкдора в git нет, поэтому результат пересборки из тега отличается от сборки из архива."
confidence: high
notes:
  - "Основная часть эксплойта лежала в тестовых файлах в git, поэтому сверка архива с тегом обнаруживает только часть бэкдора; этого достаточно, чтобы выпуск не получил P."
