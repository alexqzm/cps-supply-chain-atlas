id: plc-password-tools-2022
title: "Троянизированные программы восстановления паролей ПЛК и HMI"
type: incident
cps_relevance: direct
year: 2022
sectors: [industrial-automation]
target: "Инженеры, ищущие программы восстановления паролей ПЛК, HMI и файлов проектов"
summary: >-
  В социальных сетях и на сайтах рекламировались программы «взлома» паролей ПЛК, HMI и файлов
  проектов разных производителей. Dragos установила, что такая программа заражала компьютер
  вредоносным ПО Sality, а программа для ПЛК DirectLogic получала пароль не подбором, а через
  уязвимость встроенного ПО (CVE-2022-2003). Это атака на инструменты инженера, полученные вне
  каналов производителя.
positions: [tooling]
facts:
  - text: >-
      Программы восстановления паролей ПЛК, HMI и файлов проектов рекламировались несколькими
      учётными записями в социальных сетях и на нескольких сайтах.
    sources: [dragos-password-tools]
  - text: "Исследованная программа оказалась дроппером, заражавшим компьютер вредоносным ПО Sality."
    sources: [dragos-password-tools]
  - text: >-
      Программа для ПЛК DirectLogic не подбирала пароль, а эксплуатировала уязвимость встроенного
      ПО, позволявшую получить пароль по команде; уязвимости присвоен CVE-2022-2003, Automation
      Direct выпустила исправление встроенного ПО.
    sources: [dragos-password-tools]
  - text: >-
      В рекламе фигурировали изделия Automation Direct, Omron, Siemens, ABB, Delta, Fuji Electric,
      Mitsubishi Electric, Pro-Face, Vigor, Weintek, Allen-Bradley, Panasonic, Fatek, IDEC и LG.
    sources: [dragos-password-tools]
timeline:
  - {date: "2022-07-14", event: "Публикация Dragos", sources: [dragos-password-tools]}
attack:
  version: v20
  techniques:
    - {id: T0863, basis: author, note: "инженер сам запускает полученную программу"}
scii:
  scope: out
  scope_note: >-
    Программы получены вне цепочки выпуска производителей ПЛК; гейт допуска обновлений их не
    видит. Граф SCII здесь мог бы помочь только если организация допускает инструменты инженера
    тем же гейтом, что и обновления.
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: N
      condition: "Организация допускает на инженерные станции только инструменты с подписью их производителя."
      rationale: "У программ из социальных сетей нет подписи производителя ПЛК или HMI."
confidence: high
