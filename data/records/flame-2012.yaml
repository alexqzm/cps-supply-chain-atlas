id: flame-2012
title: "Flame: код с подписью «от Microsoft» и подмена Windows Update"
aliases: ["Skywiper", "Microsoft Security Advisory 2718704"]
type: incident
cps_relevance: general
relevance_note: >-
  Нарушитель получил возможность подписывать код так, будто его выпустил производитель, и
  подменял канал обновления в локальной сети. Тот же сценарий применим к обновлениям КФС, если
  устройство или гейт доверяет любому сертификату, выведенному из корня производителя (оценка
  автора).
year: 2012
sectors: [it-general]
target: "Windows Update в локальной сети; инфраструктура подписи кода Microsoft"
summary: >-
  Некоторые компоненты Flame были подписаны сертификатами, которые позволяли выдавать код за
  выпущенный Microsoft: служба лицензирования серверов терминалов выдавала сертификаты с правом
  подписи кода, а устаревший криптографический алгоритм позволил этим воспользоваться. Модуль-
  червь перехватывал через WPAD запросы Windows Update соседних машин и отдавал им подписанный
  исполняемый файл в пакетах CAB.
positions: [distribution]
facts:
  - text: >-
      Некоторые компоненты Flame подписаны сертификатами, позволяющими выдавать ПО за выпущенное
      Microsoft; сертификаты восходят к службе лицензирования серверов терминалов, которая
      использовала устаревший криптографический алгоритм и выдавала сертификаты с правом подписи
      кода.
    sources: [ms-advisory-2718704]
  - text: >-
      Microsoft выпустила обновление, автоматически блокирующее ПО с этими сертификатами, и
      прекратила выдачу службой лицензирования сертификатов с правом подписи кода.
    sources: [ms-advisory-2718704]
  - text: >-
      Модуль-червь создавал на заражённой машине сервер и, если настройки сети позволяли
      назначить «прокси» Windows Update через WPAD, перехватывал запросы Windows Update соседних
      машин и отдавал подписанный исполняемый файл в пакетах CAB.
    sources: [mcafee-flame-wu]
  - text: "Для Windows Vista и новее понадобился поддельный сертификат, созданный атакой на коллизию MD5 с выбранным префиксом."
    sources: [mcafee-flame-wu]
timeline:
  - {date: "2012-06-03", event: "Microsoft публикует Security Advisory 2718704", sources: [ms-advisory-2718704]}
slsa:
  version: "1.2"
  threats:
    - {id: G, basis: author, note: "подмена канала распространения обновлений"}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: P
      condition: "Подпись пакета проверяется по цепочке сертификатов до корня производителя."
      rationale: "Поддельный сертификат выводился из корня Microsoft, поэтому проверка цепочки проходила."
    - evidence: s42
      state: F
      condition: "Подпись пакета проверяется по закреплённому ключу выпуска, а не по любому сертификату производителя."
      rationale: "Ключ, которым подписан поддельный пакет, не совпадает с закреплённым ключом выпуска."
    - evidence: s53
      state: N
      condition: "Установка требует квитанцию допуска, выданную гейтом для конкретного устройства."
      rationale: "Пакет, отданный подменённым узлом обновлений, квитанции допуска не имеет."
confidence: high
notes:
  - "Сопоставление с ATT&CK не приводится: среди проверенных страниц ATT&CK v20 Flame как пример процедуры не встретился."
