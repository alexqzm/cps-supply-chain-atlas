id: tanstack-2026
title: "TanStack: отравление кэша CI и публикация с действительной аттестацией происхождения"
type: incident
cps_relevance: general
relevance_note: >-
  Вредоносные пакеты собрал и опубликовал штатный конвейер, поэтому аттестация происхождения,
  OIDC и 2FA их не остановили. Это пример, где подтверждаются все свидетельства сборки, кроме
  независимой пересборки (оценка автора).
year: 2026
sectors: [software-dev]
target: "42 пакета TanStack Router/Start в npm; рабочие процессы GitHub Actions"
summary: >-
  Запрос на слияние из одноразового форка выполнился в рабочем процессе pull_request_target с
  правом записи в общий кэш CI и отравил кэш. Последующий законный выпуск восстановил
  отравленный кэш, и короткоживущий токен публикации был извлечён из памяти исполнителя. 42
  пакета в двух версиях каждый были опубликованы с вредоносным кодом. Авторы разбора пишут, что
  npm provenance, SLSA, OIDC и 2FA сработали как заявлено, но атаку не остановили.
positions: [build]
facts:
  - text: >-
      42 пакета монорепозитория Router/Start, по две версии каждый, были опубликованы в npm с
      вредоносным кодом; версии были доступны около 20–26 минут до первого сообщения.
    sources: [tanstack-postmortem]
  - text: >-
      Запрос на слияние из одноразового форка выполнился в рабочем процессе pull_request_target,
      имевшем право записи в общий кэш CI; авторы называют это первопричиной.
    sources: [tanstack-postmortem]
  - text: >-
      Законное слияние в main запустило рабочий процесс выпуска, который восстановил отравленный
      кэш; короткоживущий токен публикации был извлечён из памяти исполнителя.
    sources: [tanstack-postmortem]
  - text: "По словам авторов, npm provenance, SLSA, OIDC и 2FA сработали как заявлено и всё равно не остановили атаку."
    sources: [tanstack-postmortem]
timeline:
  - {date: "2026-05-11", event: "Публикация вредоносных версий", sources: [tanstack-postmortem]}
  - {date: "2026-05-12", event: "Разбор инцидента TanStack (обновлён 15.05.2026)", sources: [tanstack-postmortem]}
attack:
  version: v20
  techniques:
    - {id: T1195.001, basis: author}
slsa:
  version: "1.2"
  threats:
    - {id: E, basis: author, note: "отравление кэша сборки"}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s22
      state: P
      condition: "Аттестацию происхождения формирует штатный конвейер выпуска."
      rationale: "Пакеты собраны и опубликованы штатным конвейером, и аттестация, по разбору, сработала как заявлено."
    - evidence: s21
      state: P
      condition: "Сборочный агент подписывает результат своим ключом."
      rationale: "Сборка выполнялась штатным исполнителем."
    - evidence: s24
      state: F
      condition: "Та же ревизия независимо пересобирается без общего кэша CI."
      rationale: "Отравленный кэш — вход сборки, которого нет в исходном коде, поэтому чистая пересборка даст другой результат."
    - evidence: s23
      state: F
      condition: "Сборка воспроизводима побитно."
      rationale: "Воспроизводимость делает расхождение с чистой пересборкой доказательным."
confidence: high
notes:
