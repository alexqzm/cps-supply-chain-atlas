id: notpetya-medoc-2017
title: "NotPetya: бэкдор в обновлениях M.E.Doc"
aliases: ["NotPetya", "Nyetya", "M.E.Doc"]
type: incident
cps_relevance: general
relevance_note: >-
  Вредоносный код распространялся через канал обновления делового ПО, установленного у множества
  организаций, и затронул в том числе логистику и терминалы Maersk. Такой канал ведёт и в
  организации, где работают КФС (оценка автора).
year: 2017
sectors: [it-general, maritime-logistics]
target: "ПО налоговой отчётности M.E.Doc и его сервер обновлений"
summary: >-
  Нарушитель вошёл на сервер M.E.Doc с похищенными учётными данными администратора и получил
  права root. В выпусках M.E.Doc с апреля по июнь 2017 г. был бэкдор в функции проверки
  обновлений. 27.06.2017 запросы к узлу обновлений проксировались на сервер нарушителя, и в этот
  же день начались заражения NotPetya. Как бэкдор попал в сборки, по использованному источнику
  не установлено.
positions: [distribution]
facts:
  - text: >-
      Нарушитель вошёл на сервер M.E.Doc с похищенными учётными данными администратора и получил
      права root; на сервере найдена веб-оболочка.
    sources: [talos-medoc]
  - text: >-
      Конфигурация NGINX была изменена так, что запросы к узлу обновлений upd.me-doc.com.ua
      проксировались на внешний сервер; перенаправление видно по записям журнала об истечении
      времени ожидания вышестоящего сервера.
    sources: [talos-medoc]
  - text: >-
      По исследованию ESET, на которое ссылается Talos, бэкдор добавлен в функцию IsNewUpdate
      модуля ZvitPublishedObjects.dll; он собирал идентификаторы организаций и получал команды
      через сервер обновлений.
    sources: [talos-medoc]
  - text: >-
      Бэкдор содержали сборки 10.01.175–10.01.176 (14.04.2017), 10.01.180–10.01.181 (15.05.2017)
      и 10.01.188–10.01.189 (22.06.2017).
    sources: [talos-medoc]
  - text: >-
      27.06.2017 перенаправление действовало примерно с 09:12 до 12:31 UTC, к 12:33 UTC
      конфигурация NGINX была восстановлена.
    sources: [talos-medoc]
  - text: >-
      Больше всего пострадала Maersk Line; системы APM Terminals и Damco были отключены
      превентивно, на части из 76 терминалов APM Terminals возникли заторы; Maersk оценила ущерб в
      200–300 млн долл.
    sources: [computerweekly-maersk]
timeline:
  - {date: "2017-04-14", event: "Выпуск сборок 10.01.175–10.01.176 с бэкдором", sources: [talos-medoc]}
  - {date: "2017-05-15", event: "Выпуск сборок 10.01.180–10.01.181", sources: [talos-medoc]}
  - {date: "2017-06-22", event: "Выпуск сборок 10.01.188–10.01.189", sources: [talos-medoc]}
  - {date: "2017-06-27", event: "Перенаправление узла обновлений и заражения NotPetya", sources: [talos-medoc]}
attack:
  version: v20
  techniques:
    - {id: T1195.002, basis: mitre, sources: [mitre-t1195-002]}
  objects:
    - {id: G0034, sources: [mitre-t1195-002], note: "распространение NotPetya через компрометацию M.E.Doc и подмену обновления"}
slsa:
  version: "1.2"
  threats:
    - {id: G, basis: author, note: "перенаправление сервера обновлений"}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
    - evidence: s32
      state: P
      condition: "Запись на сервер обновлений защищена учётными данными администратора."
      rationale: "Нарушитель вошёл с похищенными учётными данными; контроль доступа формально соблюдён."
    - evidence: s42
      state: P
      condition: "Выпуски с бэкдором подписаны производителем."
      rationale: "Бэкдор был в официальных сборках, поэтому подпись производителя его не выявляет."
    - evidence: s24
      state: F
      condition: "Бэкдор внесён при сборке, а не в исходный код, и пересборку выполняет независимая среда."
      rationale: "Пересобранный из исходного кода выпуск не совпадёт с выпуском, содержащим бэкдор."
    - evidence: s12
      state: F
      condition: "Бэкдор внесён в исходный код, а изменения рецензирует нескомпрометированный участник."
      rationale: "Добавление кода в функцию проверки обновлений было бы видно в рецензии."
confidence: high
notes:
  - "Точка внесения бэкдора (исходный код или сборка) в использованном источнике не установлена; условия s12 и s24 взаимоисключающие."
