id: plc-firmware-modification-2013
title: "Изменение встроенного ПО ПЛК Allen-Bradley ControlLogix L61"
type: demonstration
cps_relevance: direct
year: 2013
sectors: [industrial-automation]
target: "ПЛК Allen-Bradley ControlLogix 1756-L61"
summary: >-
  Basnight и соавторы показали на ПЛК ControlLogix L61, что легитимное встроенное ПО можно
  изменить и загрузить в контроллер. Проверка образа при обновлении сводится к контрольной сумме
  и CRC-32, которые выявляют повреждение, но не намеренное изменение: в работе Schuett (2014)
  они пересчитывались для изменённых образов, вызывавших отказ в обслуживании, в том числе
  устойчивый после перезапуска.
positions: [device]
facts:
  - text: >-
      Эксперимент на ПЛК Allen-Bradley ControlLogix L61 показал, что легитимное встроенное ПО
      можно изменить и загрузить в контроллер.
    sources: [basnight-2013]
  - text: >-
      Образ встроенного ПО проверяется контрольной суммой (сумма байтов должна равняться
      0x12345678) и CRC-32; обе проверки восстановлены Basnight и соавторами.
    sources: [schuett-2014]
    locator: "разд. 4.1.2.1, с. 47–48"
  - text: "Эти проверки не позволяют обнаружить намеренное изменение образа."
    sources: [schuett-2014]
    locator: "разд. 3.1.1, с. 26"
  - text: >-
      Schuett построил четыре атаки отказа в обслуживании на изменённом встроенном ПО, пересчитывая
      контрольную сумму и CRC; устойчивая атака переживала перезапуск, и восстановление требовало
      JTAG.
    sources: [schuett-2014]
attack:
  version: v20
  techniques:
    - {id: T1693.001, basis: author}
scii:
  scope: in
  assessed: "2026-11-05"
  evidence:
