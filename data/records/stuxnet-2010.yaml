id: stuxnet-2010
title: "Stuxnet"
aliases: ["W32.Stuxnet"]
type: incident
cps_relevance: direct
year: 2010
sectors: [industrial-automation]
target: "ПЛК Siemens SIMATIC S7 и инженерное ПО STEP 7 на компьютере программирования"
summary: >-
  Вредоносная программа подменяла на компьютере программирования библиотеку s7otbxdx.dll, через
  которую STEP 7 обменивается блоками кода с ПЛК, внедряла в ПЛК собственные блоки и скрывала их
  при чтении. Драйверы Stuxnet были подписаны сертификатами Realtek и JMicron, которые были
  скомпрометированы и отозваны в июле 2010 г. Атака шла через путь загрузки логики в устройство,
  а не через выпуск ПО производителем.
positions: [tooling, device]
facts:
  - text: >-
      Stuxnet подменяет библиотеку s7otbxdx.dll, через которую STEP 7 обменивается блоками кода с
      ПЛК, внедряет через неё в ПЛК собственные блоки и скрывает их при чтении.
    sources: [symantec-stuxnet-dossier]
    locator: "с. 36–38"
  - text: >-
      Драйверы Stuxnet подписаны сертификатами Realtek и JMicron; сертификаты были
      скомпрометированы и отозваны в июле 2010 г.
    sources: [symantec-stuxnet-dossier]
  - text: "Stuxnet обнаружен в 2010 г.; версия 1.4 досье Symantec выпущена в феврале 2011 г."
    sources: [symantec-stuxnet-dossier]
attack:
  version: v20
  techniques:
    - {id: T0889, basis: author, note: "внедрение блоков кода в программу ПЛК"}
    - {id: T0851, basis: author, note: "сокрытие внедрённых блоков при чтении"}
scii:
  scope: partial
  scope_note: >-
    Выпуск ПО производителем не затронут: вредоносные блоки создаются на скомпрометированном
    компьютере программирования и загружаются в ПЛК. Остановить атаку могли бы только
    свидетельства стадии v5; подпись пакета приведена по аналогии с подписью драйверов.
  assessed: "2026-11-05"
  evidence:
    - evidence: s51
      state: F
      condition: >-
        ПЛК принимает блоки кода только с подписью ключом, который хранится вне компьютера
        программирования (например, выдаётся при допуске изменения).
      rationale: "Блоки, созданные подменённой библиотекой, такой подписи не имеют, и устройство их отвергнет."
    - evidence: s54
      state: F
      condition: >-
        Состав загруженных блоков сообщает само устройство, и он сверяется с утверждённым эталоном
        вне компьютера программирования.
      rationale: "Сокрытие действует только при чтении через подменённую библиотеку; независимая аттестация покажет лишние блоки."
    - evidence: s42
      state: P
      condition: "Подпись проверяется по цепочке сертификатов без закрепления ключа выпуска."
      rationale: >-
        По аналогии с драйверами Stuxnet: подпись похищенным, но ещё не отозванным сертификатом
        проходит проверку. Подпись доказывает владение ключом, а не легитимность кода.
confidence: high
notes:
  - "Пути распространения Stuxnet и заражение проектов STEP 7 в запись не включены: в сверенных разделах источника этих сведений нет."
