id: dofun-head-units-2026
title: "Вредоносное ПО на головных устройствах автомобилей через встроенный механизм обновления"
type: incident
cps_relevance: direct
year: 2026
sectors: [automotive]
target: "Головные устройства DoFun на Android с системным приложением TWCore"
summary: >-
  Kaspersky описывает вредоносное ПО для автомобильных головных устройств, которое во всех
  наблюдавшихся случаях устанавливалось легитимным системным приложением TWCore, отвечающим за
  аналитику и обновление ПО устройства. Сведения об APK-файлах присылал брокер MQTT, а флаг
  installNotExists позволял TWCore ставить приложения, которых не было на устройстве. Конечная
  цель — рекламное мошенничество и прокси-ботнет; активность приписана MoYu Group, связанной с
  BADBOX.
positions: [distribution, device]
facts:
  - text: >-
      TWCore — легитимное системное приложение, собирающее аналитику и обновляющее ПО головного
      устройства; устройство встроенного ПО головных устройств DoFun позволило распространять
      вредоносное ПО.
    sources: [securelist-headunits]
  - text: >-
      Брокер MQTT на поддомене cardoor[.]cn присылает сведения об APK-файлах; флаг
      installNotExists позволяет TWCore устанавливать приложения, которых на устройстве не было.
    sources: [securelist-headunits]
  - text: >-
      Вредоносное ПО — многоступенчатый загрузчик, конечная цель которого — рекламное
      мошенничество и создание прокси-ботнета; во всех наблюдавшихся случаях его устанавливал
      TWCore.
    sources: [securelist-headunits]
  - text: >-
      Kaspersky с высокой уверенностью приписывает активность MoYu Group, связанной с ботнетом
      BADBOX; производитель уведомлён и сообщил об исправлении.
    sources: [securelist-headunits]
timeline:
  - {date: "2026-08-21", event: "Публикация Securelist", sources: [securelist-headunits]}
attack:
  version: v20
  techniques:
    - {id: T1195, basis: author}
scii:
  scope: partial
  scope_note: >-
    Встроенное приложение само устанавливает пакеты по командам с сервера, минуя проверку на
    уровне системы. SCII остановит такую установку, только если устройство требует квитанцию
    допуска для любого устанавливаемого пакета и не даёт системным приложениям её обойти.
  assessed: "2026-11-05"
  evidence:
    - evidence: s53
      state: N
      condition: >-
        Система устройства устанавливает пакеты только с квитанцией допуска, привязанной к
        устройству, и системные приложения не могут обойти эту проверку.
      rationale: "Пакеты, полученные по командам MQTT, квитанции допуска не имеют."
    - evidence: s51
      state: P
      condition: "При загрузке проверяется подпись только системного образа."
      rationale: "Приложения, установленные после загрузки, в проверяемый образ не входят."
confidence: medium
confidence_note: >-
  Отчёт одной компании по данным её телеметрии; число заражённых устройств не приводится,
  компрометация инфраструктуры доставки в источнике не утверждается.
notes:
  - "Кто управлял каналом доставки (производитель или нарушитель), в источнике не установлено, поэтому угроза SLSA не указана."
