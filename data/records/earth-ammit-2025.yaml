id: earth-ammit-2025
title: "Earth Ammit: кампании VENOM и TIDRONE"
aliases: ["VENOM", "TIDRONE"]
type: incident
cps_relevance: direct
year: 2025
sectors: [uav]
target: "Вышестоящие поставщики ПО и их клиенты в цепочке поставок беспилотных систем (Тайвань)"
summary: >-
  По данным Trend Micro, группа Earth Ammit проникала в верхний сегмент цепочки поставок
  беспилотных систем, чтобы через доверенных поставщиков атаковать их клиентов. Первая волна
  (VENOM, 2023–2024) была направлена в основном на поставщиков программных услуг, вторая
  (TIDRONE) — в основном на военную промышленность. Trend Micro описывает два пути: внедрение
  кода в ПО или подмену пакетов обновления и распространение через доверенные каналы удалённого
  мониторинга и администрирования без изменения артефактов.
positions: [upstream, distribution, operations]
facts:
  - text: >-
      Стратегия Earth Ammit состояла в проникновении в верхний сегмент цепочки поставок
      беспилотных систем, чтобы через скомпрометированных доверенных поставщиков атаковать их
      клиентов.
    sources: [trend-earth-ammit]
  - text: >-
      Кампания VENOM (2023–2024) была направлена в основном на поставщиков программных услуг;
      TIDRONE — в основном на военную промышленность, в 2024 г. также на платёжные сервисы и
      спутниковую отрасль Тайваня.
    sources: [trend-earth-ammit]
  - text: >-
      Классический путь — внедрение вредоносного кода в легитимное ПО или замена пакетов
      обновления изменёнными; общий путь — распространение через доверенные каналы, такие как
      средства удалённого мониторинга и администрирования, без изменения программных артефактов.
    sources: [trend-earth-ammit]
  - text: >-
      У нескольких скомпрометированных организаций было одно и то же ERP-ПО; взаимодействие с его
      поставщиком вывело исследователей на более раннюю кампанию VENOM.
    sources: [trend-earth-ammit]
timeline:
  - {date: "2025-05-13", event: "Публикация отчёта Trend Micro", sources: [trend-earth-ammit]}
attack:
  version: v20
  techniques:
    - {id: T1195.002, basis: author}
slsa:
  version: "1.2"
  threats:
    - {id: dependency, basis: author, note: "компрометация поставщика ради его клиентов"}
scii:
  scope: partial
  scope_note: >-
    Путь через подменённые пакеты обновления входит в область SCII; путь через доверенные каналы
    администрирования без изменения артефактов — нет.
  assessed: "2026-11-05"
  evidence:
    - evidence: s42
      state: F
      condition: "Поставщик подписывает обновления ключом, к которому у нарушителя нет доступа, а клиент проверяет подпись."
      rationale: "Подменённый пакет обновления не пройдёт проверку подписи."
    - evidence: s22
      state: N
      condition: "Допуск требует аттестацию происхождения, связывающую пакет со сборкой поставщика."
      rationale: "Для изменённого пакета подходящей аттестации нет."
confidence: medium
confidence_note: >-
  Отчёт одной компании; описание путей атаки обобщённое, без привязки к конкретным поставщикам
  и пакетам.
