# Стадии и свидетельства графа доказательств SCII, с которыми сопоставляются записи атласа.
#
# Перечень свидетельств и их стадий — по стенду scii-gate (профиль ardupilot_cubeorange).
# Связь свидетельств с артефактами ГОСТ Р 56939-2024 — по сопоставлению crosswalk/scii-gate.yaml
# репозитория rbpo-evidence (уровень «связано», интерпретация автора). Наименования артефактов —
# краткие пересказы автора модели rbpo-evidence, а не текст стандарта.
# Лицензия данных: CC BY 4.0 (LICENSE-DATA).

schema: cps-atlas/vocab/scii/v1
method: "SCII — граф доказательств целостности цепочки сборки и обновления ПО киберфизических систем"
gate:
  id: "scii-gate 0.1.2"
  doi: "10.5281/zenodo.23833592"
  url: "https://github.com/alexqzm/scii-gate"
crosswalk:
  id: "rbpo-evidence crosswalk/scii-gate.yaml"
  url: "https://github.com/alexqzm/rbpo-evidence/blob/2eb807d6e3c01c5b06a5b400b3f819e5f0f2bc9a/crosswalk/scii-gate.yaml"

# Состояние свидетельства для артефакта или действия нарушителя при условии записи.
states:
  P: "подтверждается несмотря на атаку — свидетельство обойдено"
  N: "не может быть предъявлено — при обязательном свидетельстве гейт не допускает обновление"
  F: "опровергает — атака обнаруживается"

stages:
  - {id: v1, label: "источник"}
  - {id: v2, label: "сборка"}
  - {id: v3, label: "репозиторий артефактов"}
  - {id: v4, label: "пакет обновления"}
  - {id: v5, label: "устройство"}

evidence:
  - {id: s11, stage: v1, label: "подписи коммитов", gost: ["5.14.3.3"]}
  - {id: s12, stage: v1, label: "рецензирование изменений", gost: ["5.9.3.2"]}
  - {id: s13, stage: v1, label: "отчёт статического анализа", gost: ["5.10.3.4"]}
  - {id: s14, stage: v1, label: "подписанный тег выпуска", gost: ["5.4.3.3", "5.14.3.3"]}
  - {id: s21, stage: v2, label: "подпись сборочного агента", gost: ["5.13.3.4"]}
  - {id: s22, stage: v2, label: "аттестация происхождения (SLSA)", gost: ["5.12.3.2", "5.13.3.4"]}
  - {id: s23, stage: v2, label: "воспроизводимая сборка", gost: ["5.13.3.6"]}
  - {id: s24, stage: v2, label: "независимая контрольная пересборка", gost: ["5.13.3.6"]}
  - {id: s31, stage: v3, label: "подтверждение неизменности", gost: ["5.13.3.5"]}
  - {id: s32, stage: v3, label: "контроль доступа на запись", gost: ["5.13.3.2"]}
  - {id: s41, stage: v4, label: "SBOM", gost: ["5.16.3.2"]}
  - {id: s42, stage: v4, label: "подпись пакета", gost: ["5.20.3.4"]}
  - {id: s43, stage: v4, label: "результаты тестирования", gost: ["5.18.3.2"]}
  - {id: s51, stage: v5, label: "проверка подписи образа загрузчиком", gost: ["5.20.3.4"]}
  - {id: s52, stage: v5, label: "защита от отката версии", gost: []}
  - {id: s53, stage: v5, label: "привязка к устройству", gost: []}
  - {id: s54, stage: v5, label: "аппаратная аттестация", gost: []}

gost:
  standard: "ГОСТ Р 56939-2024"
  note: "Наименования — краткие пересказы автора модели rbpo-evidence. Для s52–s54 прямого артефакта в стандарте нет."
  artifacts:
    "5.4.3.3": "Свидетельства контроля изменений ПО и документации"
    "5.9.3.2": "Результаты экспертизы кода"
    "5.10.3.4": "Отчёты статического анализа с разметкой срабатываний"
    "5.12.3.2": "Сведения о сборочной среде и её инструментах"
    "5.13.3.2": "Сведения о безопасности сборочной среды"
    "5.13.3.4": "Журналы аудита сборки"
    "5.13.3.5": "Подтверждение хранения результатов сборки (журнал, контрольные суммы)"
    "5.13.3.6": "Подтверждение повторяемости сборки (сравнение сборок)"
    "5.14.3.3": "Результаты контроля целостности исходного кода"
    "5.16.3.2": "Перечень зависимостей ПО"
    "5.18.3.2": "Отчёт о функциональном тестировании"
    "5.20.3.4": "Результаты проверки мер обеспечения целостности"
