# Позиция нарушителя: где в цепочке создания, выпуска, доставки и загрузки ПО он действовал.
# scii_stage — стадия графа SCII, которой соответствует позиция; null — позиция вне цепочки,
# которую контролирует гейт допуска (производитель, производство, инструменты, эксплуатация).
# Лицензия данных: CC BY 4.0 (LICENSE-DATA).

schema: cps-atlas/vocab/positions/v1
positions:
  - id: producer
    label: "производитель или сопровождающий"
    scii_stage: null
    note: "Вредоносное или опасное содержимое вносит владелец ключей и выпуска (угроза A в SLSA)."
  - id: upstream
    label: "вышестоящий поставщик или зависимость"
    scii_stage: null
    note: "Компрометация поставщика компонента, инструмента или зависимости, через которого нарушитель выходит на его потребителей."
  - id: source
    label: "исходный код и система управления исходным кодом"
    scii_stage: v1
  - id: build
    label: "сборочная среда"
    scii_stage: v2
  - id: repository
    label: "репозиторий артефактов и публикация"
    scii_stage: v3
  - id: distribution
    label: "канал распространения обновлений и носители"
    scii_stage: v4
  - id: device
    label: "загрузка ПО, прошивки или логики в устройство"
    scii_stage: v5
  - id: manufacturing
    label: "производство и предустановка"
    scii_stage: null
  - id: tooling
    label: "инструменты разработчика или инженера вне цепочки выпуска"
    scii_stage: null
  - id: operations
    label: "канал управления в эксплуатации"
    scii_stage: null
    note: "Удалённый доступ, VPN, команды управления оператора."
